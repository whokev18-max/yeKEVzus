<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>🌙 Admin</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div id="background"></div>

<div id="adminContainer">

<h1 id="adminTitle">
🌙 Painel yeKEVzus
</h1>

<textarea
id="text"
placeholder="Escreva algo..."
></textarea>

<select id="shape">

<option value="soft">
Arredondada
</option>

<option value="circle">
Círculo
</option>

<option value="square">
Quadrada
</option>

</select>

<select id="color">

<option value="#ffffff">
Branco
</option>

<option value="#ffb3ec">
Rosa
</option>

<option value="#c77dff">
Roxo
</option>

<option value="#8ec5ff">
Azul
</option>

</select>

<input
id="image"
type="file"
/>

<button onclick="createPost()">
Postar 🌙
</button>

</div>

<script>

async function createPost(){

    try{

        const text =
        document.getElementById("text").value;

        const imageInput =
        document.getElementById("image");

        const shape =
        document.getElementById("shape").value;

        const color =
        document.getElementById("color").value;

        const form = new FormData();

        form.append("text", text);

        form.append("shape", shape);

        form.append("color", color);

        if(imageInput.files.length > 0){

            form.append(
                "image",
                imageInput.files[0]
            );

        }

        const response = await fetch("/post", {

            method:"POST",

            body:form

        });

        await response.json();

        alert("🌙 Post criado");

        document.getElementById("text").value = "";

        document.getElementById("image").value = "";

    }

    catch(error){

        console.log(error);

        alert("Erro ao postar");

    }

}

</script>

</body>
</html>
