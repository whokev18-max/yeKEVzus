<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin 🌙</title>

<style>

body{

    background:#0f0f0f;
    color:white;
    font-family:Arial;
    padding:40px;

}

input,
textarea,
select{

    width:100%;
    padding:15px;
    margin-top:10px;
    margin-bottom:20px;

    border:none;
    border-radius:15px;

    background:#1f1f1f;
    color:white;

}

button{

    width:100%;
    padding:15px;

    border:none;

    border-radius:20px;

    background:#7c3aed;

    color:white;

    font-size:18px;

    cursor:pointer;

}

button:hover{

    opacity:0.8;

}

</style>

</head>

<body>

<h1>🌙 yeKEVzus Admin</h1>

<textarea
id="text"
placeholder="Escreva algo..."
></textarea>

<input
type="file"
id="image"
accept="image/*"
>

<select id="shape">

<option value="square">
Quadrado
</option>

<option value="circle">
Círculo
</option>

</select>

<input
type="color"
id="color"
value="#ffffff"
>

<button onclick="createPost()">
Postar 🌙
</button>

<script>

async function createPost(){

    const text =
    document.getElementById("text").value;

    const image =
    document.getElementById("image");

    const shape =
    document.getElementById("shape").value;

    const color =
    document.getElementById("color").value;

    const formData =
    new FormData();

    formData.append(
        "text",
        text
    );

    formData.append(
        "shape",
        shape
    );

    formData.append(
        "color",
        color
    );

    if(image.files[0]){

        formData.append(
            "image",
            image.files[0]
        );

    }

    try{

        const response =
        await fetch("/upload",{

            method:"POST",

            body:formData

        });

        const data =
        await response.json();

        console.log(data);

        if(data.error){

            alert(data.error);
            return;

        }

        alert("🌙 Post criado!");

        document.getElementById("text").value = "";
        document.getElementById("image").value = "";

    }

    catch(error){

        console.log(error);

        alert("Erro ao postar");

    }

}

</script>

</body>
</html>
